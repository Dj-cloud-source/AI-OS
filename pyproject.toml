[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-server-runtime"
version = "0.1.0"
description = "A local-first, policy-controlled runtime for server operations."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
    "rich>=13.9,<15",
    "SQLAlchemy>=2.0,<3",
    "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[project.scripts]
ai-server = "ai_server.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_server"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".obsidian"]

[tool.ruff.lint]
select = ["ANN", "B", "D", "E", "F", "I", "RUF100", "SIM", "UP"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "src"
strict = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
